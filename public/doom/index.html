<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freedoom</title>
<!-- Isolated in an iframe so js-dos's stylesheet cannot restyle the main site. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.css">
<script src="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #dos { width: 100%; height: 100%; }
  .err { color: #c8c8c8; font: 18px monospace; padding: 24px; }
</style>
</head>
<body>
<div id="dos"></div>
<script>
  try {
    Dos(document.getElementById('dos'), {
      url: 'freedoom-v2.jsdos', // bump the name whenever the bundle changes, so browsers can't serve a stale copy
      pathPrefix: 'https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/emulators/',
      autoStart: true,
      kiosk: true,
      noCloud: true,
    });
  } catch (e) {
    document.body.innerHTML = '<p class="err">Freedoom could not start. Reload the window to try again.</p>';
  }
</script>
</body>
</html>
