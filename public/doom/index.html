<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freedoom</title>
<!-- Isolated in an iframe so js-dos's stylesheet cannot restyle the main site. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.css">
<script src="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #dos { width: 100%; height: 100%; }
  .err { color: #c8c8c8; font: 18px monospace; padding: 24px; }
</style>
</head>
<body>
<div id="dos"></div>
<script>
(() => { // own scope: js-dos already defines globals such as `ci`
  // WASD: translated here into the keys the engine already uses (arrows move, , and . strafe),
  // so it works without touching the engine's own key config. Codes are js-dos (GLFW) key codes.
  const WASD = { KeyW: 265, KeyS: 264, KeyA: 44, KeyD: 46 };
  let dosCI = null;
  const held = new Set();
  const onKey = (e) => {
    const code = WASD[e.code];
    if (!code || !dosCI) return;
    e.preventDefault();
    e.stopImmediatePropagation(); // keep js-dos from also sending the letter itself
    const down = e.type === 'keydown';
    if (down && held.has(code)) return; // ignore auto-repeat
    down ? held.add(code) : held.delete(code);
    dosCI.sendKeyEvent(code, down);
  };
  window.addEventListener('keydown', onKey, true);
  window.addEventListener('keyup', onKey, true);
  // Release held keys if focus leaves the game, or the player keeps walking.
  window.addEventListener('blur', () => { held.forEach((c) => dosCI && dosCI.sendKeyEvent(c, false)); held.clear(); });

  try {
    Dos(document.getElementById('dos'), {
      url: 'freedoom-v3.jsdos', // bump the name whenever the bundle changes, so browsers can't serve a stale copy
      pathPrefix: 'https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/emulators/',
      autoStart: true,
      kiosk: true,
      noCloud: true,
      onEvent: (event, arg) => { if (event === 'ci-ready') { dosCI = arg; document.body.dataset.ready = '1'; } },
    });
  } catch (e) {
    document.body.innerHTML = '<p class="err">Freedoom could not start. Reload the window to try again.</p>';
  }
})();
</script>
</body>
</html>
